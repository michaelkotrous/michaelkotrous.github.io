- type: journal article
  title: "Broadband Speeds in Fibered US Markets: An Empirical Analysis"
  url: "https://doi.org/10.5325/jinfopoli.11.2021.0478"
  date: "2021"
  publisher: Journal of Information Policy
  coauthors: "with James Bailey (previously circulated by [The Center for Growth and Opportunity](https://www.thecgo.org/research/broadband-speeds-in-fibered-markets-an-empirical-analysis/){:target=\"_blank\"})"
  abstract: >
    Broadband deployment policies have directly subsidized fiber providers because fiber
    broadband delivers fast download speeds. This article examines whether recent fiber buildout
    has increased competition for Asymmetric Digital Subscriber Lines (aDSL) and cable
    incumbents and whether entry by a fiber competitor predicts faster incumbent download speeds.
    Despite significant growth in fiber broadband service in the United States between 2014 and
    2019, the number of fiber competitors in census blocks with aDSL or cable incumbents remains
    low. Further, our econometric results, while not interpretable as causal relationships,
    suggest that the entry of a rival fiber operator does not explain recent increases in cable
    and aDSL speeds.
  links:
    - text: Slides
      url: /uploads/KotrousBailey-TPRCPresentation.pdf
    - text: Video
      url: "https://youtu.be/bjMFvhriBbQ?t=40"
    - text: Replication package
      url: "https://github.com/michaelkotrous/form477-panels/tree/v.1.1.1"

- type: journal article
  title: "The Benefits of Coronavirus Suppression: A Cost-Benefit Analysis of the Response to the First Wave of COVID-19 in the United States"
  url: "https://doi.org/10.1371/journal.pone.0252729"
  date: "2020"
  publisher: PLOS ONE
  coauthors: "with James Broughel (previously circulated by the [Mercatus Center](https://www.mercatus.org/research/working-papers/benefits-coronavirus-suppression-cost-benefit-analysis-response-first-wave){:target=\"_blank\"})"
  notes: |
    - Featured in [POLITICO Magazine](https://www.politico.com/news/magazine/2020/04/02/coronavirus-economy-reopen-deaths-balance-analysis-159248#1){:target="_blank"} and the [*Tribune News Service*](https://web.archive.org/web/20230118050906/https://www.centralmaine.com/2020/05/23/commentary-will-lockdowns-really-kill-more-people-than-covid-19-itself/){:target="_blank"} wire
    - Cited by the [Cato Institute](https://www.cato.org/books/economics-one-virus){:target="_blank"} and in [*International Journal of Surgery*](https://doi.org/10.1016/j.ijsu.2020.11.015){:target="_blank"}
  abstract: >
    This paper estimates the benefits and costs of state suppression policies to "bend the
    curve" during the initial outbreak of COVID-19 in the United States. We employ an approach
    that values benefits and costs in terms of additions or subtractions to total production.
    Relative to a baseline in which only the infected and at-risk populations mitigate the
    spread of coronavirus, we estimate that total benefits of suppression policies to economic
    output are between $632.5 billion and $765.0 billion from early March 2020 to August 1,
    2020. Relative to private mitigation, output lost due to suppression policies is estimated
    to be between $214.2 billion and $331.5 billion. The cost estimate is based on the duration
    of nonessential business closures and stay-at-home orders, which were enforced between 42
    and 65 days. Our results indicate that the net benefits of suppression policies to slow the
    spread of COVID-19 are positive and may be substantial. We discuss uncertainty surrounding
    several parameters and employ alternative methods for valuing mortality benefits, which also
    suggest that suppression measures had positive net benefits.
  links:
    - text: Summary
      url: /uploads/broughel-covid-cba-mercatus-summary-v1.pdf

